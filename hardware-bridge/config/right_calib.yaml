# RIGHT-ARM RIG OFFLINE CALIBRATION CONFIG.
#
# OFFLINE calibrate-top-extrinsics USE ONLY - this is NOT a bridge runtime
# config and must never be passed to `agp-yam-bridge serve`: the right-arm
# runtime bridge (config/right_arm.yaml, port 9022) is the only runtime owner of
# can_follower_r and the right cameras.
#
# Used by calib/solve_top.sh with RIG=right (`--config config/right_calib.yaml`):
# calibrate-top-extrinsics loads it for
#   * the wrist-serial gate (hardware.camera_serial == the wrist_serial stored in
#     every calib/out/top_pairs_right/pairNN.npz, i.e. the right D405 353322271910), and
#   * the station MJCF (hardware.station_model) whose right_gripper -> right_camera
#     bodies carry the right arm's MEASURED hand-eye, and whose right_base -> top_camera chain
#     is the solver's nominal (right_base IS the right bridge's world frame, so
#     solved_from_nominal_* is a meaningful sanity number for this rig, unlike
#     the left rig where it sits near 0.61 m by construction).
# Everything the offline solver does not read (bridge, acceptance, safety,
# tracked_diff_sha256, camera_physical_port) is carried over from
# left_calib.yaml / first_acceptance.yaml unchanged and is NOT authoritative.

schema_version: 1

# Unused by the offline solver.  9020 is the port of an earlier right-arm bridge:
# the standalone capture tools REFUSE to start while anything listens on it.
bridge:
  host: 127.0.0.1
  port: 9020
  request_timeout_s: 1.0
  stale_after_s: 0.5

# Paths are resolved relative to this file.
i2rt:
  source: ../../i2rt
  package_version: "1.1.2"
  git_revision: "2c2f3ae7a9040e3ce892873eb9aa744eb286063f"
  # SHA-256 of: git -C ../i2rt diff --binary HEAD -- i2rt pyproject.toml
  # Carried over from first_acceptance.yaml; only checked by the (not yet run)
  # bridge preflight, not by the offline solver.
  tracked_diff_sha256: "ef0864c34beec62849c39f5a3f211c0758adcbac1c4a563bbfbc747fde0673a7"

hardware:
  arm: yam
  gripper: linear_4310
  # RIGHT follower chain; i2rt applies the right arm's joint-4
  # encoder offset from yam_v1.yml motor_offsets_deg_by_channel by this name.
  can_channel: can_follower_r
  can_bitrate: 1000000
  camera_model: Intel RealSense D405
  # RIGHT wrist D405 (wrist-serial gate of the solver).
  camera_serial: "353322271910"
  # From first_acceptance.yaml; unused by the offline solver.
  camera_physical_port: "6-2"
  arm_model: ../../i2rt/i2rt/robot_models/arm/yam/v1/yam.xml
  gripper_model: ../../i2rt/i2rt/robot_models/gripper/linear_4310/linear_4310.xml
  station_model: ../../i2rt/i2rt/robot_models/station/yam_station_linear_4310_d405/yam_station_linear_4310_d405.xml

# D405 RGB-D contract, 640x360@30 (the right wrist profile).  `name` only lands in
# the report's informational reference_camera block (first_acceptance.yaml calls it
# wrist_d405; the loader does not read it).
camera:
  name: wrist_d405_right
  width: 640
  height: 360
  fps: 30
  frame_timeout_s: 1.0
  stale_after_s: 0.25
  max_joint_skew_s: 0.05
  min_depth_m: 0.01
  max_depth_m: 1.0
  # The P3 postupdate report value (first_acceptance.yaml); unused offline.
  transform_translation_error_bound_m: 0.0016787199367799639
  # RIGHT chain bodies in the station MJCF: right_camera under right_gripper
  # carries the right arm's MEASURED hand-eye in OUR i2rt copy (must equal the right-arm bridge repo's value).
  station_flange_body: right_gripper
  station_camera_body: right_camera

# Unused offline; carried over.
top_camera:
  calibration_path: ../acceptance/top/top_brio_calibration.json
  stale_after_s: 0.25
  max_joint_skew_s: 0.05

# Unused offline; carried over from first_acceptance.yaml.
acceptance:
  home_joints_deg: [0, 0, 0, 88, 90, 90]
  workspace:
    frame: yam_base
    tcp: grasp_site
    x_m: [-1.60, 1.60]
    y_m: [-1.75, 1.75]
    z_m: [-0.06, 0.50]
  speed_limits:
    control_frequency_hz: 50
    joint_velocity_deg_s: 20
    joint_acceleration_deg_s2: 40
    cartesian_translation_m_s: 0.03
    cartesian_rotation_deg_s: 10
    gripper_fraction_s: 0.25

# Unused offline; carried over from first_acceptance.yaml.
safety:
  command_heartbeat_timeout_s: 0.5
  feedback_stale_after_s: 0.1
  max_tracking_error_deg: null
  tracking_error_timeout_s: 0.5
  joint_settle_tolerance_rad: 0.03
  cartesian_position_tolerance_m: 0.0005
  cartesian_orientation_tolerance_deg: 0.5
  cartesian_settle_gain_s_inv: 4.0
  cartesian_settle_max_bias_deg: 2.0
  gripper_max_effort_nm: 0.9
  gripper_contact_min_effort_nm: 0.2
  gripper_contact_release_effort_nm: 0.15
  gripper_contact_confirmation_s: 0.1
  gripper_contact_max_velocity_fraction_s: 0.1
  gripper_contact_min_open_fraction: 0.05
  gripper_stall_velocity_fraction_s: 0.01
  gripper_stall_error_fraction: 0.02
  gripper_stall_timeout_s: 0.5
  action_log_path: ../logs/actions.jsonl
